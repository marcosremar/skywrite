services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skywrite
      POSTGRES_PASSWORD: skywrite
      POSTGRES_DB: skywrite
    volumes:
      - skywrite-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skywrite"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://skywrite:skywrite@postgres:5432/skywrite?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      PORT: 4000
      CLIENT_DIST: /app/client/dist
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-http://host.docker.internal:9012}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
      AI_GATEWAY_MODEL: ${AI_GATEWAY_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  skywrite-pg:
